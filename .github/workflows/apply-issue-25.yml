name: Apply issue 25 patch

on:
  push:
    branches: [fix/25-viewport-reveal]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply viewport-driven reveal patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          tui_path = Path("src/natwalk/tui.py")
          tui = tui_path.read_text()
          tui = tui.replace(
              "_REVEAL_PAGE = 128\n_REVEAL_PREFETCH = 32\n",
              "_REVEAL_PAGE = 128\n",
          )

          marker = "    return start, above, visible\n\n\ndef _wrap_spans("
          helper = '''    return start, above, visible


def _viewport_reveal_target(
    tree: Tree,
    view: View,
    *,
    tree_lines: int,
) -> int:
    """Return the concrete rank horizon needed for this viewport plus one viewport ahead."""
    distribution = tree[view.node].distribution
    if distribution.revealed == 0:
        return min(len(distribution), _REVEAL_PAGE)

    selected = min(view.selected_rank, distribution.revealed - 1)
    start, above, _visible = _tree_viewport(
        tree,
        view,
        selected=selected,
        tree_lines=tree_lines,
    )
    row_budget = max(0, tree_lines - int(above > 0))
    return min(len(distribution), start + 2 * row_budget)


def _wrap_spans('''
