name: Apply issue 25 patch

on:
  push:
    branches: [fix/25-viewport-reveal]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply viewport-driven reveal patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          tui_path = Path("src/natwalk/tui.py")
          tui = tui_path.read_text()

          old = "_REVEAL_PAGE = 128\n_REVEAL_PREFETCH = 32\n"
          if old not in tui:
              raise SystemExit("reveal constants not found")
          tui = tui.replace(old, "_REVEAL_PAGE = 128\n", 1)

          marker = "    return start, above, visible\n\n\ndef _wrap_spans("
          helper = (
              "    return start, above, visible\n\n\n"
              "def _viewport_reveal_target(\n"
              "    tree: Tree,\n"
              "    view: View,\n"
              "    *,\n"
              "    tree_lines: int,\n"
              ") -> int:\n"
              "    \"\"\"Return the concrete rank horizon needed for this viewport plus one viewport ahead.\"\"\"\n"
              "    distribution = tree[view.node].distribution\n"
              "    if distribution.revealed == 0:\n"
              "        return min(len(distribution), _REVEAL_PAGE)\n\n"
              "    selected = min(view.selected_rank, distribution.revealed - 1)\n"
              "    start, above, _visible = _tree_viewport(\n"
              "        tree,\n"
              "        view,\n"
              "        selected=selected,\n"
              "        tree_lines=tree_lines,\n"
              "    )\n"
              "    row_budget = max(0, tree_lines - int(above > 0))\n"
              "    return min(len(distribution), start + 2 * row_budget)\n\n\n"
              "def _wrap_spans("
          )
          if marker not in tui:
              raise SystemExit("viewport insertion point not found")
          tui = tui.replace(marker, helper, 1)

          old = ") -> None:\n    \"\"\"Render one frame from replicated tree state without contacting the engine.\"\"\"\n"
          new = ") -> int:\n    \"\"\"Render one frame from replicated tree state without contacting the engine.\"\"\"\n"
          if old not in tui:
              raise SystemExit("render signature not found")
          tui = tui.replace(old, new, 1)

          old = "    frame.extend(footer)\n    _write_frame(frame)\n\n\nclass App:"
          new = "    frame.extend(footer)\n    _write_frame(frame)\n    return tree_lines\n\n\nclass App:"
          if old not in tui:
              raise SystemExit("render end not found")
          tui = tui.replace(old, new, 1)

          old = "        self.budget_step = budget_step\n        self.lines = lines\n\n        self.view = View(node=self.root)\n"
          new = "        self.budget_step = budget_step\n        self.lines = lines\n        self._tree_lines = max(2, lines) if lines is not None else 30\n\n        self.view = View(node=self.root)\n"
          if old not in tui:
              raise SystemExit("App line state not found")
          tui = tui.replace(old, new, 1)

          old = (
              "    def render(self) -> None:\n"
              "        self._refresh_suggestion()\n"
              "        cursor = self.view.node\n"
              "        _render(\n"
          )
          new = (
              "    def render(self) -> None:\n"
              "        self._refresh_suggestion()\n"
              "        cursor = self.view.node\n"
              "        self._tree_lines = _render(\n"
          )
          if old not in tui:
              raise SystemExit("App.render start not found")
          tui = tui.replace(old, new, 1)

          old = (
              "    def _move_down(self) -> bool:\n"
              "        distribution = self.tree[self.view.node].distribution\n"
              "        if distribution.revealed == 0:\n"
              "            if len(distribution):\n"
              "                self.engine.reveal(self.view.node, _REVEAL_PAGE)\n"
              "            return False\n"
              "        if self.view.selected_rank >= distribution.revealed - 1:\n"
              "            if distribution.revealed < len(distribution):\n"
              "                self.engine.reveal(self.view.node, distribution.revealed + _REVEAL_PAGE)\n"
              "            return False\n\n"
              "        self.view = move(self.tree, self.view, 1)\n"
              "        if (\n"
              "            distribution.revealed < len(distribution)\n"
              "            and self.view.selected_rank >= distribution.revealed - _REVEAL_PREFETCH\n"
              "        ):\n"
              "            self.engine.reveal(self.view.node, distribution.revealed + _REVEAL_PAGE)\n"
              "        return True\n"
          )
          new = (
              "    def _prefetch_viewport(self) -> None:\n"
              "        distribution = self.tree[self.view.node].distribution\n"
              "        if distribution.revealed >= len(distribution):\n"
              "            return\n\n"
              "        target = _viewport_reveal_target(\n"
              "            self.tree,\n"
              "            self.view,\n"
              "            tree_lines=self._tree_lines,\n"
              "        )\n"
              "        if target <= distribution.revealed:\n"
              "            return\n\n"
              "        self.engine.reveal(\n"
              "            self.view.node,\n"
              "            max(target, distribution.revealed + _REVEAL_PAGE),\n"
              "        )\n\n"
              "    def _move_down(self) -> bool:\n"
              "        distribution = self.tree[self.view.node].distribution\n"
              "        if distribution.revealed == 0:\n"
              "            if len(distribution):\n"
              "                self.engine.reveal(self.view.node, _REVEAL_PAGE)\n"
              "            return False\n"
              "        if self.view.selected_rank >= distribution.revealed - 1:\n"
              "            self._prefetch_viewport()\n"
              "            return False\n\n"
              "        self.view = move(self.tree, self.view, 1)\n"
              "        self._prefetch_viewport()\n"
              "        return True\n"
          )
          if old not in tui:
              raise SystemExit("move-down block not found")
          tui = tui.replace(old, new, 1)
          tui_path.write_text(tui)

          test_path = Path("tests/test_tui.py")
          tests = test_path.read_text()
          old = "from natwalk.tree import Distribution, Edge, Tree\n"
          if old not in tests:
              raise SystemExit("tree import not found")
          tests = tests.replace(old, "from natwalk.sync import ReplicaDistribution\n" + old, 1)

          anchor = "    def test_right_and_left_move_model_search_and_view_root_together(self) -> None:\n"
          regression = (
              "    def test_down_prefetch_depends_on_viewport_height(self) -> None:\n"
              "        def make_app(tree_lines: int):\n"
              "            probabilities = (0.001,) * 128\n"
              "            distribution = ReplicaDistribution(\n"
              "                1000,\n"
              "                tuple(range(128)),\n"
              "                probabilities,\n"
              "                1.0 - math.fsum(probabilities),\n"
              "            )\n"
              "            tree = Tree(distribution)\n\n"
              "            class RevealRecorder:\n"
              "                def __init__(self) -> None:\n"
              "                    self.tree = tree\n"
              "                    self.calls: list[tuple[int, int]] = []\n\n"
              "                def reveal(self, node: int, stop: int) -> None:\n"
              "                    self.calls.append((node, stop))\n\n"
              "            app = object.__new__(App)\n"
              "            app.engine = RevealRecorder()\n"
              "            app.view = View(selected_rank=31)\n"
              "            app._tree_lines = tree_lines\n"
              "            return app\n\n"
              "        short = make_app(8)\n"
              "        self.assertTrue(short._move_down())\n"
              "        self.assertEqual(short.view.selected_rank, 32)\n"
              "        self.assertEqual(short.engine.calls, [])\n\n"
              "        tall = make_app(64)\n"
              "        self.assertTrue(tall._move_down())\n"
              "        self.assertEqual(tall.view.selected_rank, 32)\n"
              "        self.assertEqual(tall.engine.calls, [(0, 256)])\n\n"
          )
          if anchor not in tests:
              raise SystemExit("interactive test insertion point not found")
          tests = tests.replace(anchor, regression + anchor, 1)
          test_path.write_text(tests)

          progressive_path = Path("tests/test_progressive_tui.py")
          progressive = progressive_path.read_text()
          replacements = (
              (
                  "    def test_down_prefetches_next_rank_page_before_prefix_boundary(self) -> None:\n",
                  "    def test_tall_viewport_prefetches_next_page_before_visible_boundary(self) -> None:\n",
              ),
              ("            lines=8,\n", "            lines=64,\n"),
              (
                  "            app.view = View(node=app.root, selected_rank=95)\n"
                  "            self.assertTrue(app.handle_key(\"DOWN\"))\n"
                  "            self.assertEqual(app.view.selected_rank, 96)\n",
                  "            # The selected rank itself is nowhere near the revealed boundary.\n"
                  "            # A tall viewport nevertheless needs enough read-ahead to keep\n"
                  "            # that boundary out of the ordinary scrolling window.\n"
                  "            app.view = View(node=app.root, selected_rank=31)\n"
                  "            self.assertTrue(app.handle_key(\"DOWN\"))\n"
                  "            self.assertEqual(app.view.selected_rank, 32)\n",
              ),
          )
          for old, new in replacements:
              if old not in progressive:
                  raise SystemExit(f"progressive test fragment not found: {old!r}")
              progressive = progressive.replace(old, new, 1)
          progressive_path.write_text(progressive)
          PY

      - uses: astral-sh/setup-uv@v6
      - name: Format changed Python
        run: uvx ruff format src/natwalk/tui.py tests/test_tui.py tests/test_progressive_tui.py
      - name: Lint changed Python
        run: uvx ruff check src/natwalk/tui.py tests/test_tui.py tests/test_progressive_tui.py
      - name: Test
        run: |
          uv sync --locked
          uv run python -m unittest discover -s tests -v

      - name: Commit patch and remove this temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-issue-25.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make reveal prefetch viewport-driven"
          git push
