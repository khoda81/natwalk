name: Format continuation preview

on:
  push:
    branches: [agent/continuation-previews]

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message == 'Format continuation preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/continuation-previews
      - name: Apply Ruff formatting diff
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/natwalk/tui.py")
          text = path.read_text()
          old = '''            separator_style = _grayscale(\n                _relative_probability(preview_nats, branch_reference)\n            )\n'''
          new = '''            separator_style = _grayscale(_relative_probability(preview_nats, branch_reference))\n'''
          if text.count(old) != 1:
              raise RuntimeError("expected exactly one formatting target")
          path.write_text(text.replace(old, new, 1))
          Path(".github/workflows/format-continuation-preview.yml").unlink()
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format continuation preview renderer"
          git push origin HEAD:agent/continuation-previews
