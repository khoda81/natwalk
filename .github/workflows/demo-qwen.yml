name: Qwen README demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/demo-qwen.tape"
      - "examples/llm_app.py"
      - "src/natwalk/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/demo-qwen.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: qwen-readme-demo
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Cache Qwen GGUF
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--Qwen--Qwen3-4B-GGUF
          key: qwen3-4b-q6-k-8a08533841623c2a689763b9318d8e27b3e052ad5b38015d4be4c04fa96f68a3

      - name: Fetch Qwen GGUF
        run: >-
          uvx --from huggingface-hub hf download
          Qwen/Qwen3-4B-GGUF
          Qwen3-4B-Q6_K.gguf
          --revision bc640142c66e1fdd12af0bd68f40445458f3869b

      - name: Render demo
        uses: charmbracelet/vhs-action@v1
        with:
          path: assets/demo-qwen.tape

      - name: Check whether the GIF changed
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- assets/demo-qwen.gif; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update generated-demo PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          branch=automation/demo-qwen
          git config user.name "vhs-action 📼"
          git config user.email "actions@github.com"
          git switch -C "$branch"
          git add assets/demo-qwen.gif
          git commit -m "Update Qwen README demo"
          git push --force origin "HEAD:$branch"

          pr=$(gh pr list \
            --head "$branch" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -z "$pr" ]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "Update Qwen README demo" \
              --body "Regenerated automatically from \`assets/demo-qwen.tape\` by the Qwen README demo workflow."
          fi
