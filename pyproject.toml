[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "natwalk"
version = "1.1.0"
description = "Navigate autoregressive model distributions in information space"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Mahdi Khodabandeh" }]
keywords = ["information-theory", "autoregressive", "probability", "autocomplete", "tui"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.hatch.build.targets.wheel]
packages = ["src/natwalk"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "EXE"]
ignore = ["E501"]
